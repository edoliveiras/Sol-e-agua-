name: Testar e publicar SOL & ÁGUA BRASIL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-publish"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Validar testes
        run: bun run test
      - name: Gerar versão de produção
        run: bun run build
      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar acesso público ao site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          check_page() {
            path="$1"
            expected="$2"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "${PAGE_URL}${path}" --output /tmp/site.html
            grep -Fqi "$expected" /tmp/site.html
          }
          check_page "" "SOL"
          check_page "praias/" "Praias do Brasil"
          check_page "cachoeiras/" "Cachoeiras de Minas Gerais"
          check_page "buscar/" "Explorar destinos e hospedagens"
          check_page "mapa/" "Localização dos destinos"
          check_page "destino/cachoeira-da-farofa/" "Cachoeira da Farofa"
          check_page "destino/pousada-luar-do-cipo/" "Pousada Luar do Cipó"
          check_page "destino/day-use-village-resort/" "Day Use Village Resort"
